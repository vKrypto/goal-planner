<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#294c3e"/><meta name="description" content="A little intention. A little progress. Plan your targets and purchases with Target Planner, your private offline companion."/><link rel="icon" type="image/svg+xml" href="./icon.svg"/><link rel="manifest" href="./manifest.webmanifest"/><link rel="apple-touch-icon" href="./icon-192.png"/><title>Target Planner — Make room for what matters</title></head><body><div id="root"></div><script>
/* Recovery: open the app with ?reset to clear the offline cache (your plans are kept), and show a
   fallback if the app hasn't rendered after 10 s. Kept inline so it works even if the app bundle fails. */
(function(){
  function clearCache(){ var jobs=[]; if('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));})); if(window.caches) jobs.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x);}));})); return Promise.all(jobs).catch(function(){}); }
  window.__resetAppCache=function(){ clearCache().then(function(){ location.replace(location.pathname); }); };
  if(/[?&]reset\b/.test(location.search)){ window.__resetAppCache(); return; }
  setTimeout(function(){ var root=document.getElementById('root'); if(root && !root.children.length){ root.innerHTML='<div style="font-family:sans-serif;max-width:420px;margin:15vh auto;padding:24px;text-align:center;color:#293d33"><h2 style="font-weight:500">The app didn\u2019t load</h2><p style="color:#6f7b62;line-height:1.6">This is usually an outdated offline copy. Clearing it is safe \u2014 your saved plans stay on this device.</p><button onclick="__resetAppCache()" style="background:#294c3e;color:#fff;border:0;border-radius:7px;padding:12px 18px;font-size:14px;cursor:pointer">Clear cache &amp; reload</button></div>'; } },10000);
})();
</script><script type="module" src="/src/main.tsx"></script></body></html>
